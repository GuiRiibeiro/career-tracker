<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Two - EA FC 26 Career</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-title">
            <h1>LEAGUE <span>TWO</span></h1>
        </div>
        <nav>
            <button class="tab-btn active" data-target="view-table">Tabela</button>
            <button class="tab-btn" data-target="view-matches">Jogos</button>
            <button class="tab-btn" data-target="view-stats">Estatísticas</button>
        </nav>
    </header>

    <main>
        <!-- Aba: Tabela de Classificação -->
        <section id="view-table" class="view-section active">
            <div class="table-container">
                <table id="league-table">
                    <thead>
                        <tr>
                            <th>POS</th>
                            <th class="col-clube">CLUBE</th>
                            <th>J</th>
                            <th>V</th>
                            <th>E</th>
                            <th>D</th>
                            <th>GP</th>
                            <th>GC</th>
                            <th>SG</th>
                            <th>PTS</th>
                            <th>FORMA</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Renderizado via JavaScript -->
                    </tbody>
                </table>
            </div>
            
            <div class="legend">
                <div class="legend-item"><span class="color-box promoted"></span> Promovido - League One</div>
                <div class="legend-item"><span class="color-box playoffs"></span> Qualificado - League Two Playoffs</div>
                <div class="legend-item"><span class="color-box relegated"></span> Despromoção - National League</div>
            </div>

            <div class="data-actions">
                <button id="btn-export">Exportar JSON</button>
                <input type="file" id="input-import" accept=".json" hidden>
                <button id="btn-import">Importar JSON</button>
            </div>
        </section>

        <!-- Aba: Cadastro de Jogos -->
        <section id="view-matches" class="view-section hidden">
            <h2>Registrar Jogo</h2>
            <form id="match-form" class="card">
                <div class="form-group">
                    <input type="number" id="match-round" placeholder="Rodada" required min="1" max="46">
                </div>
                <div class="form-group match-inputs">
                    <select id="home-team" required><option value="">Mandante</option></select>
                    <input type="number" id="home-score" placeholder="Gols" required min="0">
                    <span>X</span>
                    <input type="number" id="away-score" placeholder="Gols" required min="0">
                    <select id="away-team" required><option value="">Visitante</option></select>
                </div>
                <button type="submit" class="btn-primary">Salvar Jogo</button>
            </form>

            <h2>Últimos Jogos</h2>
            <div id="matches-list" class="matches-list">
                <!-- Renderizado via JavaScript -->
            </div>
        </section>

        <!-- Aba: Estatísticas -->
        <section id="view-stats" class="view-section hidden">
            <div id="stats-container" class="stats-grid">
                <!-- Renderizado via JavaScript -->
            </div>
        </section>
    </main>

    <!-- Usando type="module" para suportar import/export no JS -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
